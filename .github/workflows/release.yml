name: Release

# v5.1.0 のようなバージョンタグを push すると、Windows 版をビルドして
# 同名の GitHub Release にアセットとして添付する。
# 手動実行 (workflow_dispatch) の場合は Release を作らず、成果物を
# Actions の artifact として残すだけの試し焼きになる。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # electron 本体のダウンロード (約 100MB) を再利用する
      - name: Cache Electron download
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # タグと package.json の version がずれていると、成果物の名前が
      # タグと食い違い、electron-updater の更新もつながらなくなる。
      # 先に落として気づけるようにする。
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne "v$version") {
            Write-Host "::error::タグ $tag に対して package.json の version は $version です。'v$version' のタグを打つか、package.json を $($tag.TrimStart('v')) に更新してください。"
            exit 1
          }
          Write-Host "tag $tag == package.json $version"

      - name: Build Windows installer
        shell: pwsh
        run: npx electron-builder --win --publish never

      - name: List build output
        shell: pwsh
        run: Get-ChildItem dist -File | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize

      # 配布物が揃っているかを Release を作る前に確かめる。latest.yml と
      # .blockmap はアプリ内の自動アップデートが参照するので欠かせない。
      - name: Verify build output
        shell: pwsh
        run: |
          foreach ($required in @('AeroWidget-Setup-*.exe', 'AeroWidget-Portable-*.exe', 'latest.yml')) {
            if (-not (Get-ChildItem "dist\$required" -File -ErrorAction SilentlyContinue)) {
              Write-Host "::error::$required がビルドされていません"
              exit 1
            }
          }
          Write-Host 'ok'

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gh が非ゼロで終わっても例外にせず、終了コードで分岐したいため
          $PSNativeCommandUseErrorActionPreference = $false

          $tag = '${{ github.ref_name }}'
          $patterns = @(
            'AeroWidget-Setup-*.exe',
            'AeroWidget-Setup-*.exe.blockmap',
            'AeroWidget-Portable-*.exe',
            'latest.yml'
          )
          $assets = $patterns |
            ForEach-Object { Get-ChildItem "dist\$_" -File -ErrorAction SilentlyContinue } |
            Select-Object -ExpandProperty FullName -Unique
          $assets | ForEach-Object { Write-Host "  添付: $(Split-Path $_ -Leaf)" }

          # 版の付け方: マイナーが奇数なら先行版 (5.3 / 5.5)、偶数なら安定版 (5.2 / 6.0)。
          # electron-updater は GitHub の prerelease 印を見て安定版ユーザーへの配信を止めるので、
          # 印の付け忘れが事故に直結する。人間の記憶ではなく版番号から機械的に決める。
          $minor = [int]($tag -replace '^v\d+\.(\d+)\..*$', '$1')
          $pre = ($minor % 2) -eq 1
          Write-Host "$tag -> $(if ($pre) { '先行版 (prerelease)' } else { '安定版' })"

          # 途中で失敗して再実行した場合に備え、Release が既にあれば貼り直す
          gh release view $tag 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag は既にあるのでアセットを差し替えます"
            gh release upload $tag @assets --clobber
          } else {
            Write-Host "Release $tag を作成します"
            # リリース本文は日本語で書く。アプリの更新画面にそのまま出るので、
          # 英語のコミット件名が並ぶだけの --generate-notes では利用者に伝わらない。
          # docs/changelog.html の該当バージョンの節から箇条書きを拾う。
          $notesFile = Join-Path $env:RUNNER_TEMP 'relnotes.md'
          $ver = $tag.TrimStart('v')
          $notes = ''
          $cl = 'docs/changelog.html'
          if (Test-Path $cl) {
            $html = Get-Content $cl -Raw
            # <div class="v">5.9.1</div> から次の </section> までを取り出す
            $pattern = '(?s)<div class="v">' + [regex]::Escape($ver) + '</div>.*?</section>'
            $m = [regex]::Match($html, $pattern)
            if ($m.Success) {
              $body = $m.Value
              # 見出しと箇条書きを出現順に拾う
              $lines = @()
              foreach ($t in [regex]::Matches($body, '(?s)<h4>(.*?)</h4>|<li>(.*?)</li>')) {
                if ($t.Groups[1].Success) {
                  $lines += ''
                  $lines += '### ' + ($t.Groups[1].Value -replace '<[^>]+>', '').Trim()
                } else {
                  $txt = $t.Groups[2].Value -replace '<[^>]+>', ''
                  $txt = [System.Net.WebUtility]::HtmlDecode($txt).Trim()
                  if ($txt) { $lines += '- ' + $txt }
                }
              }
              $notes = ($lines -join "`n").Trim()
            }
          }
          if (-not $notes) { $notes = "$tag" }
          $isPre = ($minor % 2) -eq 1
          if ($isPre) {
            $notes += "`n`n---`n" +
              'これは先行版です。設定画面の「設定」ページで「先行版を受け取る」を ON にした方にだけ届きます。'
          }
          $notes += "`n`n[すべての変更点](https://orahu01.github.io/aerowidget/changelog.html)"
          Set-Content -Path $notesFile -Value $notes -Encoding UTF8
          Write-Host '--- リリース本文 ---'
          Write-Host $notes

          $flags = @('--title', $tag, '--notes-file', $notesFile, '--verify-tag')
            if ($pre) { $flags += '--prerelease' }
            gh release create $tag @assets @flags
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release に失敗しました (exit $LASTEXITCODE)" }

      # 手動実行のときは Release を作らず、動作確認用に成果物だけ残す
      - name: Upload artifacts (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: AeroWidget-windows
          path: |
            dist/AeroWidget-Setup-*.exe
            dist/AeroWidget-Portable-*.exe
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14
